product:
  type: kmp/lib
  platforms: [ jvm ]

dependencies:
  - $compose.runtime: exported
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kotlinx.coroutines.core: exported
  - $libs.koin.core: exported
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.material.icons.extended

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  compose:
    enabled: true
    resources:
      packageName: com.ranjan.adbsend.resources
      exposedAccessors: true
