name: Release

# Push a tag like v1.2.0 to build the installers and publish a GitHub Release.
# Run manually (Actions > Release > Run workflow) to build installers without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.0 (manual runs upload installers as artifacts only)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  installers:
    name: Installers (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Kotlin Toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: kotlin-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up JDK (provides jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Test
        run: ./kotlin test

      - name: Build installers
        run: packaging/build-installers.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.arch }}
          path: |
            build/dist/*.pkg
            build/dist/*.dmg
            build/dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          ## Download

          | Your Mac | Installer (recommended) | Disk image |
          |---|---|---|
          | Apple Silicon (M1 or newer) | \`DroidBridge-${TAG#v}-macos-arm64.pkg\` | \`DroidBridge-${TAG#v}-macos-arm64.dmg\` |
          | Intel | \`DroidBridge-${TAG#v}-macos-x64.pkg\` | \`DroidBridge-${TAG#v}-macos-x64.dmg\` |

          Not sure which Mac you have? Apple menu > About This Mac: "Chip: Apple M..." means Apple Silicon.

          **Install:** double-click the \`.pkg\` and click Install. DroidBridge appears in your Applications folder.

          **First launch:** this build is not signed with an Apple Developer ID, so macOS may say it cannot verify the developer.
          Right-click DroidBridge in Applications and choose **Open**, or go to System Settings > Privacy & Security and click **Open Anyway**. You only need to do this once.

          NOTES
          PRERELEASE=""
          [[ "$TAG" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DroidBridge $TAG" \
            --notes-file notes.md \
            --generate-notes \
            $PRERELEASE
