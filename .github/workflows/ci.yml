name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Kotlin Toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml') }}
          restore-keys: kotlin-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: ./kotlin build

      - name: Test
        run: ./kotlin test
